      - label: "Railway"
        url: "https://railway.app/"
        description: "Deploy backend services quickly"
      - label: "Supabase"
        url: "https://supabase.com/"
        description: "Open-source Firebase alternative"

  - name: "AI & APIs"
    cardWidth: 6
    accent: "#d4a5ff"
    description: "Build with AI models and data services."
    links:
