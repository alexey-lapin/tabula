hero:
  title: "A calm start page"
  description: "Quick, categorized shortcuts for the places you visit most."

# Reusable variant definitions. A card or link selects from these by name via
# `variants`, and renders one chip per selected variant instead of a single
# clickable row, with each variant's vars substituted into the url template.
variantDefs:
  dev:
    color: "#60c4a2"
    vars:
      env: "dev"
      branch: "develop"
  uat:
    color: "#ffb347"
    vars:
      env: "uat"
      branch: "release"
  prd:
    color: "#ff6b6b"
    vars:
      env: "prod"
      branch: "main"

categories:
  - name: "Daily ops"
    cols: 4
    accent: "#8f7bff"
    description: "Keep comms, notes, and the calendar within one hop."
    links:
      - label: "Inbox"
        url: "https://mail.google.com/"
      - label: "Calendar"
        url: "https://calendar.google.com/"
        description: "Schedule and join meetings"
      - label: "Notion"
        url: "https://www.notion.so/"
        description: "Docs, notes, and checklists"

  - name: "Build & ship"
    kicker: "All-in-one workspace"
    cols: 4
    accent: "#60c4a2"
    description: "Development touchpoints when you're in maker mode."
    links:
      - label: "GitHub"
        url: "https://github.com/"
        description: "Repositories, issues, and pull requests"
      - label: "Astro Docs"
        url: "https://docs.astro.build/"
        description: "Reference for building with Astro"
      - label: "Stack Overflow"
        url: "https://stackoverflow.com/"
        description: "Find answers and snippets"

  - name: "Learning"
    cols: 4
    accent: "#ffb347"
    description: "Sharpen skills with tutorials, patterns, and examples."
    links:
      - label: "MDN Web Docs"
        url: "https://developer.mozilla.org/"
        description: "HTML, CSS, and JS references"
      - label: "Frontend Practice"
        url: "https://www.frontendpractice.com/"
        description: "Recreate real-world designs"
      - label: "Keyframes"
        url: "https://keyframes.app/"
        description: "Motion and animation ideas"

  - name: "Reference"
    cols: 6
    accent: "#5da8ff"
    description: "Utilities and lookups you reach for often."
    links:
      - label: "Can I Use"
        url: "https://caniuse.com/"
        description: "Check browser support"
      - label: "Regex101"
        url: "https://regex101.com/"
        description: "Test patterns and debug quickly"
      - label: "Color Hunt"
        url: "https://colorhunt.co/"
        description: "Curated color palettes"

  - name: "Design & Assets"
    cols: 4
    accent: "#ff6eb3"
    description: "Icons, fonts, and inspiration for visual work."
    links:
      - label: "Figma"
        url: "https://www.figma.com/"
        description: "Design and prototype interfaces"
      - label: "Unsplash"
        url: "https://unsplash.com/"
        description: "Free high-quality photos"
      - label: "Lucide Icons"
        url: "https://lucide.dev/"
        description: "Beautiful open-source icons"

  - name: "Productivity"
    cols: 4
    accent: "#7ed6df"
    description: "Tools to organize, track, and ship work."
    links:
      - label: "Linear"
        url: "https://linear.app/"
        description: "Issue tracking and project planning"
      - label: "Excalidraw"
        url: "https://excalidraw.com/"
        description: "Sketching and diagramming"
      - label: "Hemingway"
        url: "https://hemingwayapp.com/"
        description: "Make writing clear and bold"

  - name: "Cloud & Deploy"
    cols: 4
    accent: "#ffa07a"
    description: "Hosting, monitoring, and infrastructure."
    links:
      - label: "Vercel"
        url: "https://vercel.com/"
        description: "Deploy and scale frontend apps"
      - label: "Railway"
        url: "https://railway.app/"
        description: "Deploy backend services quickly"
      - label: "Supabase"
        url: "https://supabase.com/"
        description: "Open-source Firebase alternative"

  - name: "AI & APIs"
    cols: 6
    accent: "#d4a5ff"
    description: "Build with AI models and data services."
    links:
      - label: "Anthropic"
        url: "https://www.anthropic.com/"
        description: "Claude API and documentation"
      - label: "OpenAI"
        url: "https://platform.openai.com/"
        description: "GPT models and playground"
      - label: "Replicate"
        url: "https://replicate.com/"
        description: "Run AI models via API"

  - name: "News & Community"
    cols: 6
    accent: "#ffda79"
    description: "Stay current with tech trends and discussions."
    links:
      - label: "Hacker News"
        url: "https://news.ycombinator.com/"
        description: "Tech news and thoughtful discussion"
      - label: "Dev.to"
        url: "https://dev.to/"
        description: "Community articles and tutorials"
      - label: "Product Hunt"
        url: "https://www.producthunt.com/"
        description: "Discover new products daily"

  - name: "Work Hub"
    kicker: "Nested example"
    cols: 12
    accent: "#ff7eb9"
    description: "A nested card with both direct links and organized subsections."
    links:
      - label: "Company Portal"
        url: "https://portal.example.com/"
        description: "Main company dashboard"
      - label: "Team Wiki"
        url: "https://wiki.example.com/"
        description: "Internal documentation"
    children:
      - name: "Active Projects"
        cols: 4
        accent: "#60c4a2"
        links:
          - label: "Project Alpha"
            url: "https://alpha.example.com/"
            description: "Q1 priority project"
          - label: "Project Beta"
            url: "https://beta.example.com/"
            description: "Customer dashboard redesign"

      - name: "Team Resources"
        cols: 4
        accent: "#5da8ff"
        links:
          - label: "Design System"
            url: "https://design.example.com/"
            description: "Component library and guidelines"
          - label: "API Docs"
            url: "https://api.example.com/"
            description: "Internal API reference"

      - name: "Analytics"
        cols: 4
        accent: "#ffb347"
        description: "Track performance and user metrics."
        links:
          - label: "Google Analytics"
            url: "https://analytics.google.com/"
            description: "Website traffic and behavior"
          - label: "Mixpanel"
            url: "https://mixpanel.com/"
            description: "Product analytics"

  - name: "Subsections Only"
    cols: 8
    description: "A nested card with no direct links of its own — just subsections."
    children:
      - name: "Active Projects"
        cols: 4
        accent: "#60c4a2"
        links:
          - label: "Project Alpha"
            url: "https://alpha.example.com/"
            description: "Q1 priority project"
          - label: "Project Beta"
            url: "https://beta.example.com/"
            description: "Customer dashboard redesign"

      - name: "Team Resources"
        cols: 4
        links:
          - label: "Design System"
            url: "https://design.example.com/"
            description: "Component library and guidelines"
          - label: "API Docs"
            url: "https://api.example.com/"
            description: "Internal API reference"

      - name: "Analytics"
        cols: 4
        accent: "#ffb347"
        description: "Track performance and user metrics."
        links:
          - label: "Google Analytics"
            url: "https://analytics.google.com/"
            description: "Website traffic and behavior"
          - label: "Mixpanel"
            url: "https://mixpanel.com/"
            description: "Product analytics"

  - name: "Quick Links"
    cols: 4
    transparent: true
    description: "A transparent card blends seamlessly with the background."
    links:
      - label: "Wikipedia"
        url: "https://www.wikipedia.org/"
        description: "Free encyclopedia"
      - label: "YouTube"
        url: "https://www.youtube.com/"
        description: "Video platform"

  - name: "Featured"
    cols: 4
    accent: "#ffd700"
    background: "linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%)"
    description: "Custom gradient background for visual emphasis."
    links:
      - label: "Featured Project"
        url: "https://example.com/featured"
        description: "Highlighted with custom styling"
      - label: "Special Resource"
        url: "https://example.com/special"
        description: "Important reference material"

  - name: "Highlights"
    cols: 4
    accent: "#22d3ee"
    background: "linear-gradient(135deg, rgba(34, 211, 238, 0.18) 0%, rgba(59, 130, 246, 0.18) 100%)"
    description: "A card with an ocean gradient background."
    links:
      - label: "Trending"
        url: "https://example.com/trending"
        description: "What's popular right now"
      - label: "Editor's Pick"
        url: "https://example.com/pick"
        description: "Hand-selected highlight"
    children:
      - name: "This Week"
        cols: 12
        accent: "#38bdf8"
        description: "Fresh picks updated every Monday."
        links:
          - label: "New Releases"
            url: "https://example.com/new"
            description: "Latest additions"
          - label: "Rising"
            url: "https://example.com/rising"
            description: "Gaining momentum fast"
      - name: "Staff Favorites"
        cols: 12
        accent: "#818cf8"
        description: "Hand-curated by the team."
        links:
          - label: "Deep Dives"
            url: "https://example.com/deep-dives"
            description: "Long-form standouts"
          - label: "Hidden Gems"
            url: "https://example.com/gems"
            description: "Underrated finds"

  - name: "Vars Example"
    cols: 6
    accent: "#7ed6df"
    description: "Card-level vars resolve inside link URLs."
    vars:
      base: "https://portal.example.com"
      team: "alpha"
    links:
      - label: "Team Overview"
        url: "{{base}}/teams/{{team}}"
        description: "Uses card vars"
    children:
      - name: "Analytics"
        cols: 6
        vars:
          team: "beta"
        links:
          - label: "Metrics"
            url: "{{base}}/teams/{{team}}/metrics"
            description: "Overrides team var"

  - name: "Swagger UI"
    cols: 6
    accent: "#5da8ff"
    description: "One row per service, one chip per environment."
    variants: [dev, uat, prd]
    links:
      - label: "Orders API"
        url: "https://orders.{{env}}.example.com/swagger-ui"
      - label: "Billing API"
        url: "https://billing.{{env}}.example.com/swagger-ui"
        description: "No UAT deployment"
        variants: [dev, prd]
      - label: "Swagger Aggregator"
        url: "https://swagger.example.com/"
        description: "Not per-environment — a plain link on a variant card"
        variants: []
      - label: "Legacy API"
        variants:
          - ref: dev
            url: "https://legacy-dev.example.com/swagger"
          - ref: prd
            url: "https://legacy.example.com/swagger"
          - label: "v1"
            color: "#9fb2d8"
            url: "https://legacy.example.com/v1/swagger"

  - name: "Pipelines"
    cols: 6
    accent: "#d4a5ff"
    description: "Card-level variant overrides and vars in the same url."
    variantDefs:
      dev:
        vars:
          branch: "devel"
    variants: [dev, prd]
    links:
      - label: "Build"
        url: "https://ci.example.com/{{env}}/tree/{{branch}}"
      - label: "Deploy"
        url: "https://ci.example.com/deploy/{{env}}"
    children:
      - name: "Dashboards"
        cols: 12
        links:
          - label: "Grafana"
            url: "https://grafana.example.com/d/{{env}}"

  - name: "Empty"
    cols: 4
    description: "Just an empty card to show handling of no links or children."
